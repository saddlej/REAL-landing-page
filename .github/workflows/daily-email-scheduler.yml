name: Daily Email Scheduler

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-scheduled-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduled-emails endpoint
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://realverified.co.uk/api/scheduled-emails"
